name: Test and build portable apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: virtual-worm-studio
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python launch.py --doctor
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/web.test.mjs
  build:
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualWormStudio-${{ matrix.os }}
          path: virtual-worm-studio/release/*
          if-no-files-found: error
